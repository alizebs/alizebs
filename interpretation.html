<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interpretation</title>
    <link rel="stylesheet" href="alizebs.css">
</head>
<body class="body">
    <div class="heading"><h1>Share Interpretation</h1></div>
    <form class="form" action="https://formsubmit.co/alizebsid@gmail.com" method="POST">
        <input type="hidden" name="_next" value="alizebs.github.io/alizebs">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="enter name; real or made up"
         required maxlength="20"><br>
         <label for="title">Enter title of poem:</label>
        <input type="text" id="title" name="reference" placeholder="enter the title" required title="enter 'general' if your question isn't referenced"><br>
        <label for="question">Share your interpretation</label>
        <textarea class="textarea" id="question" required title="write something" minlength="10" placeholder="share your interpretation and thoughts about the poem: describe what ideas and metaphors did you interpret from the poem and what do you think the central idea of the poem is"></textarea><br>
        <label for="insta">Instagram id (optional):</label>
        <input type="text" id="insta" placeholder="@name" pattern="@[\w.]+" title="please enter valid id starting with @ (or leave empty)"><br><br><br>
        <button class="button2" type="submit">Send</button>
    </form>
    <div class="footer"> <hr><a href="index.html">Back to Home</a> </div>
</body>
</html>
